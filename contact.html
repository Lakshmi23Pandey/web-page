<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact Us — Simple Page</title>
  <style>
    :root{
      --bg:#f6f9fc;
      --card:#ffffff;
      --accent:#2463eb;
      --muted:#6b7280;
      --radius:12px;
      --maxw:760px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    }
    *{box-sizing:border-box}
  
    .card{
      width:100%;
      max-width:var(--maxw);
      background:var(--card);
      border-radius:var(--radius);
      box-shadow:0 8px 30px rgba(30,41,59,0.06);
      overflow:hidden;
      display:grid;
      grid-template-columns:1fr 420px;
    }
    @media (max-width:880px){
      .card{grid-template-columns:1fr;}
    }
    .info{
      padding:34px 30px;
      background:linear-gradient(180deg, rgba(36,99,235,0.07), rgba(36,99,235,0.02));
    }
    .info h1{margin:0 0 8px;font-size:22px}
    .info p{margin:0;color:var(--muted)}

    form{
      padding:28px 30px;
      display:flex;
      flex-direction:column;
      gap:12px;
    }
    .row{display:flex;gap:12px}
    .row .field{flex:1}
    label{
      font-size:13px;
      display:block;
      margin-bottom:6px;
      color:var(--muted);
    }
    input[type="text"], input[type="email"], textarea, input[type="tel"]{
      width:100%;
      padding:10px 12px;
      border:1px solid #e6e9ef;
      border-radius:10px;
      font-size:14px;
      outline:none;
      background:transparent;
    }
    textarea{min-height:120px;resize:vertical}
    input:focus, textarea:focus{box-shadow:0 0 0 4px rgba(36,99,235,0.08);border-color:var(--accent)}

    .actions{display:flex;gap:10px;align-items:center;margin-top:6px}
    button{
      appearance:none;
      border:0;
      padding:10px 14px;
      border-radius:10px;
      font-weight:600;
      cursor:pointer;
    }
    .btn-primary{background:var(--accent);color:white}
    .btn-ghost{background:transparent;border:1px solid #e6e9ef;color:var(--muted)}

    .note{font-size:13px;color:var(--muted)}
    .success{background:#ecfdf5;color:#065f46;padding:10px;border-radius:8px;border:1px solid #bbf7d0}
    .error{background:#fff1f2;color:#7f1d1d;padding:10px;border-radius:8px;border:1px solid #fecaca}

    footer{padding:12px 18px;font-size:13px;color:var(--muted);text-align:center}

    /* small helper */
    .hidden{display:none}
  </style>
</head>
<body>
  <main class="card" role="main">
    <section class="info" aria-labelledby="contact-heading">
      <h1 id="contact-heading">Get in touch</h1>
      <p>Have a question or want to say hi? Fill the form — we'll reply within 1–2 business days (this demo doesn't actually send emails).</p>

      <div style="margin-top:18px;display:flex;gap:10px;flex-direction:column">
        <div style="display:flex;gap:8px;align-items:center">
          <strong>Office</strong>
          <span style="color:var(--muted);font-size:13px">Remote / India</span>
        </div>
        <div style="display:flex;gap:8px;align-items:center">
          <strong>Email</strong>
          <span style="color:var(--muted);font-size:13px">contact@example.com</span>
        </div>
      </div>
    </section>

    <form id="contactForm" novalidate>
      <div class="row">
        <div class="field">
          <label for="name">Your name</label>
          <input id="name" name="name" type="text" required placeholder="Jane Doe">
        </div>
        <div class="field">
          <label for="phone">Phone (optional)</label>
          <input id="phone" name="phone" type="tel" placeholder="+91 98765 43210">
        </div>
      </div>

      <div>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required placeholder="you@domain.com">
      </div>

      <div>
        <label for="subject">Subject</label>
        <input id="subject" name="subject" type="text" required placeholder="What's this about?">
      </div>

      <div>
        <label for="message">Message</label>
        <textarea id="message" name="message" required placeholder="Write your message..."></textarea>
      </div>

      <div id="formFeedback" class="hidden" aria-live="polite"></div>

      <div class="actions">
        <button class="btn-primary" type="submit">Send message</button>
        <button class="btn-ghost" type="button" id="resetBtn">Reset</button>
        <div style="flex:1"></div>
        <div class="note">We respect your privacy — no spam.</div>
      </div>
    </form>

  </main>

  <footer>Made with ♥ — Simple contact page demo</footer>

  <script>
    // Simple client-side validation + fake send
    (function(){
      const form = document.getElementById('contactForm');
      const feedback = document.getElementById('formFeedback');
      const resetBtn = document.getElementById('resetBtn');

      function show(type, text){
        feedback.className = '';
        feedback.classList.add(type === 'success' ? 'success' : 'error');
        feedback.textContent = text;
        feedback.classList.remove('hidden');
      }

      function clearFeedback(){
        feedback.textContent = '';
        feedback.className = 'hidden';
      }

      function validEmail(email){
        // simple email check (not RFC-perfect but good for demo)
        return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
      }

      form.addEventListener('submit', function(e){
        e.preventDefault();
        clearFeedback();

        const data = new FormData(form);
        const name = (data.get('name') || '').trim();
        const email = (data.get('email') || '').trim();
        const subject = (data.get('subject') || '').trim();
        const message = (data.get('message') || '').trim();

        if(!name || !email || !subject || !message){
          show('error','Please complete all required fields.');
          return;
        }
        if(!validEmail(email)){
          show('error','Please enter a valid email address.');
          return;
        }

        // Simulate sending (no real backend in this demo)
        show('success','Sending message...');

        // fake delay to mimic network
        setTimeout(()=>{
          show('success', 'Thanks, ' + name + '! Your message has been received. (Demo — not actually sent)');
          form.reset();
        }, 800);
      });

      resetBtn.addEventListener('click', function(){
        form.reset();
        clearFeedback();
      });
    })();
  </script>
</body>
</html>
